engine_schema: chain-policy/v0.3
policy_id: chain-safety-policy
policy_version: 0.3-step5
site_id: HYUMC_GURI
runtime:
  maximum_attempts: 2
  approved_agents:
    stroke-screening-agent:
      versions:
      - 0.3.0
      - 0.3.0-v03-mock1
      data_scopes:
      - context:read
    clinical-summary-agent:
      versions:
      - 0.2.0
      - 0.2.0-v03-mock1
      data_scopes:
      - context:read
      - document:read
      - observation:read
      - lab:read
      - imaging_status:read
    tpa-decision-support-agent:
      versions:
      - 0.4.0
      - 0.4.0-v03-mock1
      data_scopes:
      - context:read
  allowed_actions_for_agents:
  - READ_DATA_API
  - RETURN_RESULT
  forbidden_actions_for_agents:
  - ORDER_PLACE
  - MEDICATION_ORDER
  - EMR_WRITE
  - NOTIFY_DIRECT
  - EXTERNAL_EGRESS
  transition_rules:
  - id: P-05-HITL1
    from: S1
    to: S2
    checkpoint: HITL_1_PROCEED_TO_CT
    decision: PROCEED_TO_CT
  - id: NCCT-TRANSITION-INTEGRITY
    from: S2
    to: S2_1
    guard:
      all:
      - eq:
        - $event.event_type
        - IMAGING_STUDY_COMPLETED
      - eq:
        - $payload.study_type
        - NCCT_HEAD
      - exists: $episode.context.ct_order_id
      - eq:
        - $payload.order_id
        - $episode.context.ct_order_id
  - id: P-05-HITL2
    from: S2_1
    to: S3
    checkpoint: HITL_2_THROMBOLYSIS
    decision: THROMBOLYSIS_YES
  notification_templates:
  - CT_ROOM_PREALERT_L1
  - NURSE_S1_PREP
  - NEURO_ONCALL_S1
  - HITL1_OVERDUE
  - CT_ROOM_CONFIRMED_L2
  - NEURO_ONCALL_S2
  - CT_OVERDUE
  - NEURO_ONCALL_CT_DONE
  - HITL2_OVERDUE
  - NURSE_S3_THROMBOLYSIS_PLANNED
  - EM_S3_THROMBOLYSIS_PLANNED
  - NEURO_S3_CONFIRM
  hitl_rules:
    HITL_1_PROCEED_TO_CT:
      roles:
      - EM_PHYSICIAN
      - NEUROLOGIST
    HITL_2_THROMBOLYSIS:
      roles:
      - NEUROLOGIST
      confirmations_on_decisions:
      - THROMBOLYSIS_YES
      required_confirmations:
      - NCCT_NO_HEMORRHAGE_PHYSICIAN_READ
      - LKW_RECONFIRMED_WITH_FAMILY
      - BP_RECHECK_BELOW_185_110
      - NO_ANTICOAGULANT_RECONFIRMED
