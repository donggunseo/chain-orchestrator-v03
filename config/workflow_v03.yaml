# 13항목 State 작성 명세. Worker/client compiler가 기존 Runtime DSL로 변환한다.
# 명세의 자료 요구사항은 표시용이며 기존 임상 전이조건을 추가하지 않는다.
state_spec_schema: chain-state-spec/v1
workflow_id: acute-stroke-ivt-mvp
site_id: HYUMC_GURI
initial_state: S0
states:
  S0:
    State:
      name: ED_REGISTERED
      terminal: false
    Clinical Goal and Scope:
      goal: 급성 뇌졸중 평가 필요성을 Screening으로 확인한다. 진단 확정을 뜻하지 않는다.
      start: 알려진 초기 입력으로 Episode를 시작한다.
      end: 초진기록 공개 후 수락된 Screening 결과로 양성/음성 분기한다.
    Entry Trigger:
      description: 백엔드가 initial 데이터로 Episode를 생성하고 S0를 시작한다. State 진입 Action이 Episode를 생성하지 않는다.
    Incoming Data / Evidence:
      description: 공개된 초진기록 참조와 현재 확보된 요청 범위 자료.
    Data requirement:
    - field: document:DOC-2610060412
      requirement: MANDATORY
      description: 현재 공개된 ED 초진기록의 정확한 버전과 출처. 임의로 미래 문서를 채우지 않는다.
    - field: lkw
      requirement: OPTIONAL
      description: 현재까지 알려진 마지막 정상 시각. 미확보이면 미확보로 표시한다.
    - field: glucose
      requirement: OPTIONAL
      description: 현재 공개된 혈당 관찰값. 값과 단위를 추론하지 않는다.
    Required Capability:
      on_enter: []
    Agent Input:
      derive: true
    Expected Agent Output:
      derive: true
    HITL:
      derive: true
    Guard / Transition condition:
      transitions:
      - when:
          event_type: CLINICAL_DOCUMENT_UPDATED
          payload.document_type: ED_INITIAL_NOTE
        do:
        - authorize_and_run: stroke_screening
          mode: screening
      - when:
          event_type: AGENT_RESULT_AVAILABLE
          agent: stroke_screening
          result.screening_result: POSITIVE
          mode: screening
        next_state: S1
      - when:
          event_type: AGENT_RESULT_AVAILABLE
          agent: stroke_screening
          result.screening_result: NEGATIVE
          mode: screening
        next_state: S0X
    Next State / Branch:
      derive: true
    Timer / Exception / Fail-safe:
      exceptions:
      - 초진기록 Event 없이 Screening을 시작하지 않는다. Screening 실패는 audit에 남고 임의 성공으로 전이하지 않는다.
    Safety / Audit:
      policy_id: chain-safety-policy
      notes:
      - 자료 요구사항·조건·freshness는 표시 명세이며 임상 Gate나 원천 Fact status를 변경하지 않는다.
      - Agent의 자동 오더·처방·투약·EMR 기록·직접 알림은 금지한다. Notifier와 표시 효과는 MOCK_RECORDED만 기록한다.
  S1:
    State:
      name: ACUTE_STROKE_SUSPECTED
      terminal: false
    Clinical Goal and Scope:
      goal: 수락된 Screening과 고정된 근거를 표시해 의료진의 CT 경로 결정을 돕는다.
      start: Screening POSITIVE로 진입한다.
      end: 'HITL #1의 CT 진행/경로 종료 결정 또는 보류.'
    Entry Trigger:
      description: S0에서 수락된 Screening POSITIVE 결과.
    Incoming Data / Evidence:
      description: 고정된 Screening 입력 Snapshot과 준비된 요청 범위 Structured Context. 단순 추가 자료로 열린 근거를 바꾸지 않는다.
    Data requirement:
    - field: document:DOC-2610060412
      requirement: MANDATORY
      description: 현재 공개된 ED 초진기록의 정확한 버전과 출처. 임의로 미래 문서를 채우지 않는다.
    - field: lkw
      requirement: OPTIONAL
      description: 현재까지 알려진 마지막 정상 시각. 미확보이면 미확보로 표시한다.
    - field: glucose
      requirement: OPTIONAL
      description: 현재 공개된 혈당 관찰값. 값과 단위를 추론하지 않는다.
    Required Capability:
      on_enter:
      - apply_effect:
          operation: SET_FLAG
          resource: CHAIN_S1
          target: EHR_PATIENT_LIST
      - apply_effect:
          operation: SET_DASHBOARD
          resource: CHAIN_DASHBOARD
          target: CHAIN_CONSOLE
      - notify:
          template: CT_ROOM_PREALERT_L1
          channel: CONSOLE
          recipient: CT_ROOM_BOARD
      - notify:
          template: NURSE_S1_PREP
          channel: CONSOLE
          recipient: NURSE_STATION
      - notify:
          template: NEURO_ONCALL_S1
          channel: CONSOLE
          recipient: SMS_GATEWAY
      - request_hitl: HITL_1_PROCEED_TO_CT
    Agent Input:
      derive: true
    Expected Agent Output:
      derive: true
    HITL:
      derive: true
    Guard / Transition condition:
      transitions:
      - when:
          event_type: HITL_DECISION
          payload.checkpoint: HITL_1_PROCEED_TO_CT
          payload.decision: PROCEED_TO_CT
        next_state: S2
      - when:
          event_type: HITL_DECISION
          payload.checkpoint: HITL_1_PROCEED_TO_CT
          payload.decision: NOT_STROKE_PATHWAY
        next_state: S1X
      - when:
          event_type: HITL_DECISION
          payload.checkpoint: HITL_1_PROCEED_TO_CT
          payload.decision: DEFER
        do:
        - record_reason
        - re_request_hitl_after_min: 10
    Next State / Branch:
      derive: true
    Timer / Exception / Fail-safe:
      timeout:
        after_min: 20
        do:
        - notify:
            template: HITL1_OVERDUE
            channel: CONSOLE
            recipient: NURSE_STATION
      exceptions:
      - 'Summary 성공 및 근거 검증 후 HITL #1을 연다. 실패를 미확인 성공으로 대체하지 않는다.'
    Safety / Audit:
      policy_id: chain-safety-policy
      notes:
      - 자료 요구사항·조건·freshness는 표시 명세이며 임상 Gate나 원천 Fact status를 변경하지 않는다.
      - Agent의 자동 오더·처방·투약·EMR 기록·직접 알림은 금지한다. Notifier와 표시 효과는 MOCK_RECORDED만 기록한다.
  S2:
    State:
      name: STROKE_CT_CONFIRMED
      terminal: false
    Clinical Goal and Scope:
      goal: CT 촬영을 기다리며 새 근거에 따라 tPA interim 의사결정지원을 반복한다.
      start: '의료진이 HITL #1에서 CT 진행을 결정한다.'
      end: 해당 오더의 뇌 NCCT 완료 Event로 S2_1에 진입한다.
    Entry Trigger:
      description: '검증된 HITL #1 PROCEED_TO_CT 결정.'
    Incoming Data / Evidence:
      description: 외부 의료진의 OCS 오더와 공개된 기록·관찰·검사·영상 상태 및 명시적 정정.
    Data requirement:
    - field: lkw
      requirement: MANDATORY
      description: 공개된 마지막 정상 시각과 그 출처.
    - field: anticoagulant
      requirement: MANDATORY
      description: 공개된 항응고제 관련 자료. 근거 없음과 복용 없음 확정을 구분한다.
    - field: platelet_count
      requirement: MANDATORY
      description: LIS 혈소판 결과. 미확보이면 PENDING/UNKNOWN을 유지한다.
    - field: inr
      requirement: MANDATORY
      description: LIS INR 결과. 미확보이면 PENDING/UNKNOWN을 유지한다.
    - field: ct_order_id
      requirement: MANDATORY
      description: 현재 확보된 CT 오더 ID. 기존 NCCT 전이는 해당 오더 일치를 확인한다.
    - field: ncct_completed
      requirement: MANDATORY
      description: NCCT 촬영 완료 자료. 출혈 없음 판독이나 치료 승인을 뜻하지 않는다.
    - field: ncct_order_id
      requirement: MANDATORY
      description: NCCT 자료의 오더 참조.
    - field: weight_kg
      requirement: MANDATORY
      description: 공개된 체중 관찰값. 치료 처방을 생성하지 않는다.
    - field: nihss
      requirement: OPTIONAL
      description: 공개된 NIHSS 관찰값.
    - field: sbp
      requirement: OPTIONAL
      description: 공개된 수축기 혈압. HITL의 의료진 재확인과 구분한다.
    - field: dbp
      requirement: OPTIONAL
      description: 공개된 이완기 혈압.
    - field: glucose
      requirement: OPTIONAL
      description: 공개된 혈당과 단위.
    - field: age
      requirement: OPTIONAL
      description: Episode 생성 시 알려진 나이.
    Required Capability:
      on_enter:
      - notify:
          template: CT_ROOM_CONFIRMED_L2
          channel: CONSOLE
          recipient: CT_ROOM_BOARD
      - notify:
          template: NEURO_ONCALL_S2
          channel: CONSOLE
          recipient: SMS_GATEWAY
      - authorize_and_run: tpa_decision_support
        mode: interim
    Agent Input:
      derive: true
    Expected Agent Output:
      derive: true
    HITL:
      derive: true
    Guard / Transition condition:
      transitions:
      - when:
          event_type: IMAGING_STUDY_COMPLETED
          payload.study_type: NCCT_HEAD
        guard:
          all:
          - exists: $episode.context.ct_order_id
          - eq:
            - $payload.order_id
            - $episode.context.ct_order_id
        next_state: S2_1
      - when:
          event_type:
          - ORDER_PLACED
          - CLINICAL_DOCUMENT_UPDATED
          - OBSERVATION_RECORDED
          - LAB_RESULTED
          - IMAGING_STUDY_COMPLETED
          - SOURCE_CORRECTED
          - SOURCE_ERROR_REPORTED
          - SOURCE_RETRACTED
          - SOURCE_CONFLICT_DECLARED
        do:
        - authorize_and_run: tpa_decision_support
          mode: interim
    Next State / Branch:
      derive: true
    Timer / Exception / Fail-safe:
      timeout:
        after_min: 30
        do:
        - notify:
            template: CT_OVERDUE
            channel: CONSOLE
            recipient: NURSE_STATION
      exceptions:
      - 다른 오더의 NCCT는 전이를 일으키지 않는다. 검사 완비나 review_ready를 NCCT 전이 Gate로 추가하지 않는다.
    Safety / Audit:
      policy_id: chain-safety-policy
      notes:
      - 자료 요구사항·조건·freshness는 표시 명세이며 임상 Gate나 원천 Fact status를 변경하지 않는다.
      - Agent의 자동 오더·처방·투약·EMR 기록·직접 알림은 금지한다. Notifier와 표시 효과는 MOCK_RECORDED만 기록한다.
  S2_1:
    State:
      name: CT_COMPLETED
      terminal: false
    Clinical Goal and Scope:
      goal: 수락된 tPA final 결과와 고정된 근거로 의료진의 IV thrombolysis 계획 결정을 요청한다.
      start: 해당 CT 오더의 뇌 NCCT 촬영 완료.
      end: 'HITL #2에서 시행 계획/비시행을 결정하거나 보류한다.'
    Entry Trigger:
      description: NCCT 완료 및 현재 CT 오더 일치.
    Incoming Data / Evidence:
      description: 현재 공개된 요청 범위의 자료로 final을 준비한다. 미확보 자료도 그대로 포함한다.
    Data requirement:
    - field: lkw
      requirement: MANDATORY
      description: 공개된 마지막 정상 시각과 그 출처.
    - field: anticoagulant
      requirement: MANDATORY
      description: 공개된 항응고제 관련 자료. 근거 없음과 복용 없음 확정을 구분한다.
    - field: platelet_count
      requirement: MANDATORY
      description: LIS 혈소판 결과. 미확보이면 PENDING/UNKNOWN을 유지한다.
    - field: inr
      requirement: MANDATORY
      description: LIS INR 결과. 미확보이면 PENDING/UNKNOWN을 유지한다.
    - field: ct_order_id
      requirement: MANDATORY
      description: 현재 확보된 CT 오더 ID. 기존 NCCT 전이는 해당 오더 일치를 확인한다.
    - field: ncct_completed
      requirement: MANDATORY
      description: NCCT 촬영 완료 자료. 출혈 없음 판독이나 치료 승인을 뜻하지 않는다.
    - field: ncct_order_id
      requirement: MANDATORY
      description: NCCT 자료의 오더 참조.
    - field: weight_kg
      requirement: MANDATORY
      description: 공개된 체중 관찰값. 치료 처방을 생성하지 않는다.
    - field: nihss
      requirement: OPTIONAL
      description: 공개된 NIHSS 관찰값.
    - field: sbp
      requirement: OPTIONAL
      description: 공개된 수축기 혈압. HITL의 의료진 재확인과 구분한다.
    - field: dbp
      requirement: OPTIONAL
      description: 공개된 이완기 혈압.
    - field: glucose
      requirement: OPTIONAL
      description: 공개된 혈당과 단위.
    - field: age
      requirement: OPTIONAL
      description: Episode 생성 시 알려진 나이.
    Required Capability:
      on_enter:
      - notify:
          template: NEURO_ONCALL_CT_DONE
          channel: CONSOLE
          recipient: SMS_GATEWAY
      - authorize_and_run: tpa_decision_support
        mode: final
      - request_hitl: HITL_2_THROMBOLYSIS
        after: tpa_decision_support.final
    Agent Input:
      derive: true
    Expected Agent Output:
      derive: true
    HITL:
      derive: true
    Guard / Transition condition:
      transitions:
      - when:
          event_type:
          - ORDER_PLACED
          - CLINICAL_DOCUMENT_UPDATED
          - OBSERVATION_RECORDED
          - LAB_RESULTED
          - IMAGING_STUDY_COMPLETED
          - SOURCE_CORRECTED
          - SOURCE_ERROR_REPORTED
          - SOURCE_RETRACTED
          - SOURCE_CONFLICT_DECLARED
        do:
        - authorize_and_run: tpa_decision_support
          mode: final
        - request_hitl: HITL_2_THROMBOLYSIS
          after: tpa_decision_support.final
      - when:
          event_type: HITL_DECISION
          payload.checkpoint: HITL_2_THROMBOLYSIS
          payload.decision: THROMBOLYSIS_YES
        next_state: S3
      - when:
          event_type: HITL_DECISION
          payload.checkpoint: HITL_2_THROMBOLYSIS
          payload.decision: THROMBOLYSIS_NO
        next_state: S3N
      - when:
          event_type: HITL_DECISION
          payload.checkpoint: HITL_2_THROMBOLYSIS
          payload.decision: HOLD
        do:
        - record_hold_reason
        - re_request_hitl_after_min: 10
    Next State / Branch:
      derive: true
    Timer / Exception / Fail-safe:
      timeout:
        after_min: 10
        do:
        - notify:
            template: HITL2_OVERDUE
            channel: CONSOLE
            recipient: SMS_GATEWAY
      exceptions:
      - 'final 및 Summary 성공 후 HITL #2를 연다. 일반 추가는 열린 요청을 유지하고 관련 명시적 정정만 재확인한다.'
    Safety / Audit:
      policy_id: chain-safety-policy
      notes:
      - 자료 요구사항·조건·freshness는 표시 명세이며 임상 Gate나 원천 Fact status를 변경하지 않는다.
      - Agent의 자동 오더·처방·투약·EMR 기록·직접 알림은 금지한다. Notifier와 표시 효과는 MOCK_RECORDED만 기록한다.
  S3:
    State:
      name: THROMBOLYSIS_PLANNED
      terminal: true
    Clinical Goal and Scope:
      goal: 의료진의 IV thrombolysis 시행 계획을 Mock 알림으로 기록하고 경로를 종료한다.
      start: 'HITL #2에서 THROMBOLYSIS_YES를 수락한다.'
      end: 진행 중 작업을 처리한 뒤 Workflow를 종료한다.
    Entry Trigger:
      description: 허용 역할과 YES의 네 확인사항을 만족한 고정 요청 응답.
    Incoming Data / Evidence:
      description: 새 치료 자료를 자동 생성하지 않는다.
    Data requirement: []
    Required Capability:
      on_enter:
      - notify:
          template: NURSE_S3_THROMBOLYSIS_PLANNED
          channel: CONSOLE
          recipient: NURSE_STATION
      - notify:
          template: EM_S3_THROMBOLYSIS_PLANNED
          channel: CONSOLE
          recipient: EHR_MESSENGER
      - notify:
          template: NEURO_S3_CONFIRM
          channel: CONSOLE
          recipient: SMS_GATEWAY
      - seal_audit_trail
    Agent Input:
      derive: true
    Expected Agent Output:
      derive: true
    HITL:
      derive: true
    Guard / Transition condition:
      transitions: []
    Next State / Branch:
      derive: true
    Timer / Exception / Fail-safe:
      exceptions:
      - 처방·투약은 외부 EMR 절차이다. 완료된 Workflow가 후속 Event를 계속 받는다고 주장하지 않는다.
    Safety / Audit:
      policy_id: chain-safety-policy
      notes:
      - 자료 요구사항·조건·freshness는 표시 명세이며 임상 Gate나 원천 Fact status를 변경하지 않는다.
      - Agent의 자동 오더·처방·투약·EMR 기록·직접 알림은 금지한다. Notifier와 표시 효과는 MOCK_RECORDED만 기록한다.
  S3N:
    State:
      name: THROMBOLYSIS_NOT_PLANNED
      terminal: true
    Clinical Goal and Scope:
      goal: 의료진의 IV thrombolysis 비시행 결정을 감사 기록에 남기고 경로를 종료한다.
      start: 'HITL #2에서 THROMBOLYSIS_NO를 수락한다.'
      end: 감사 기록과 진행 중 작업 처리 후 Workflow 종료.
    Entry Trigger:
      description: '검증된 HITL #2 THROMBOLYSIS_NO 결정.'
    Incoming Data / Evidence:
      description: 고정된 요청과 의료진 결정 근거.
    Data requirement: []
    Required Capability:
      on_enter:
      - seal_audit_trail
    Agent Input:
      derive: true
    Expected Agent Output:
      derive: true
    HITL:
      derive: true
    Guard / Transition condition:
      transitions: []
    Next State / Branch:
      derive: true
    Timer / Exception / Fail-safe:
      exceptions:
      - 추가 치료·전원 경로는 이 State에서 자동 실행하지 않는다.
    Safety / Audit:
      policy_id: chain-safety-policy
      notes:
      - 자료 요구사항·조건·freshness는 표시 명세이며 임상 Gate나 원천 Fact status를 변경하지 않는다.
      - Agent의 자동 오더·처방·투약·EMR 기록·직접 알림은 금지한다. Notifier와 표시 효과는 MOCK_RECORDED만 기록한다.
  S1X:
    State:
      name: NOT_STROKE_PATHWAY
      terminal: true
    Clinical Goal and Scope:
      goal: 의료진 판단으로 뇌졸중 경로를 종료하고 Mock 표시 해제 및 사전알림 취소 안내를 기록한다.
      start: 'HITL #1에서 NOT_STROKE_PATHWAY를 수락한다.'
      end: Mock 효과·취소 알림 기록과 감사 봉인 요청 후 경로 종료.
    Entry Trigger:
      description: '검증된 HITL #1 NOT_STROKE_PATHWAY 결정.'
    Incoming Data / Evidence:
      description: 고정된 요청과 의료진 결정 근거.
    Data requirement: []
    Required Capability:
      on_enter:
      - apply_effect:
          operation: CLEAR_FLAG
          resource: CHAIN_S1
          target: EHR_PATIENT_LIST
      - apply_effect:
          operation: CLEAR_DASHBOARD
          resource: CHAIN_DASHBOARD
          target: CHAIN_CONSOLE
      - notify:
          template: CT_ROOM_PREALERT_CANCELLED
          channel: CONSOLE
          recipient: CT_ROOM_BOARD
      - notify:
          template: NURSE_S1_PREP_CANCELLED
          channel: CONSOLE
          recipient: NURSE_STATION
      - notify:
          template: NEURO_ONCALL_S1_CANCELLED
          channel: CONSOLE
          recipient: SMS_GATEWAY
      - seal_audit_trail
    Agent Input:
      derive: true
    Expected Agent Output:
      derive: true
    HITL:
      derive: true
    Guard / Transition condition:
      transitions: []
    Next State / Branch:
      derive: true
    Timer / Exception / Fail-safe:
      exceptions:
      - Mock 취소 안내는 이전 SMS나 실제 병원 알림을 삭제·회수했다는 뜻이 아니다.
    Safety / Audit:
      policy_id: chain-safety-policy
      notes:
      - 자료 요구사항·조건·freshness는 표시 명세이며 임상 Gate나 원천 Fact status를 변경하지 않는다.
      - Agent의 자동 오더·처방·투약·EMR 기록·직접 알림은 금지한다. Notifier와 표시 효과는 MOCK_RECORDED만 기록한다.
  S0X:
    State:
      name: SCREEN_NEGATIVE_CLOSED
      terminal: true
    Clinical Goal and Scope:
      goal: 선별 음성 결과를 감사 기록에 남기고 조용히 경로를 종료한다. 뇌졸중 배제를 뜻하지 않는다.
      start: Screening NEGATIVE를 수락한다.
      end: 감사 기록과 진행 중 작업 처리 후 Workflow 종료.
    Entry Trigger:
      description: S0에서 수락된 Screening NEGATIVE 결과.
    Incoming Data / Evidence:
      description: 해당 Screening의 고정된 입력과 결과.
    Data requirement: []
    Required Capability:
      on_enter:
      - seal_audit_trail
    Agent Input:
      derive: true
    Expected Agent Output:
      derive: true
    HITL:
      derive: true
    Guard / Transition condition:
      transitions: []
    Next State / Branch:
