version: 0.3-state-spec1
subscriptions:
- event_type: ED_ENCOUNTER_CREATED
- event_type: CLINICAL_DOCUMENT_UPDATED
- event_type: OBSERVATION_RECORDED
- event_type: ORDER_PLACED
- event_type: LAB_RESULTED
- event_type: IMAGING_STUDY_COMPLETED
- event_type: MANUAL_DATA_AVAILABLE
- event_type: SOURCE_CORRECTED
- event_type: SOURCE_ERROR_REPORTED
- event_type: SOURCE_RETRACTED
- event_type: SOURCE_CONFLICT_DECLARED
context_service:
  agent: clinical_summary
  mode: context
  available_states: '*'
agents:
  stroke_screening:
    timeout_s: 30
    needs_context: true
    scopes:
      screening:
      - document:DOC-2610060412
      - lkw
      - glucose
    outputs:
      screening:
      - screening_result
      - mock_only
      - basis
  clinical_summary:
    timeout_s: 120
    needs_context: false
    scopes:
      context:
      - age
    outputs:
      context:
      - structured_context
      - missing_information
      - cache
  tpa_decision_support:
    timeout_s: 30
    needs_context: true
    scopes:
      interim: &id001
      - lkw
      - ncct_completed
      - ncct_order_id
      - ct_order_id
      - platelet_count
      - inr
      - anticoagulant
      - weight_kg
      - nihss
      - sbp
      - dbp
      - glucose
      - age
      final: *id001
    outputs:
      interim:
      - mode
      - evidence_package
      - assessment
      - mock_only
      final:
      - mode
      - evidence_package
      - assessment
      - mock_only
hitl_checkpoints:
  HITL_1_PROCEED_TO_CT:
    roles:
    - EM_PHYSICIAN
    - NEUROLOGIST
    options:
    - PROCEED_TO_CT
    - NOT_STROKE_PATHWAY
    - DEFER
    required_confirmations: []
    confirmations_on_decisions: []
    after: stroke_screening.screening
    question: 급성 뇌졸중 의심(S1). 응급 Stroke CT를 진행하시겠습니까?
  HITL_2_THROMBOLYSIS:
    roles:
    - NEUROLOGIST
    options:
    - THROMBOLYSIS_YES
    - THROMBOLYSIS_NO
    - HOLD
    required_confirmations:
    - NCCT_NO_HEMORRHAGE_PHYSICIAN_READ
    - LKW_RECONFIRMED_WITH_FAMILY
    - BP_RECHECK_BELOW_185_110
    - NO_ANTICOAGULANT_RECONFIRMED
    confirmations_on_decisions:
    - THROMBOLYSIS_YES
    after: tpa_decision_support.final
    question: 현재 고정된 tPA/TNK 근거묶음을 확인하고 IV thrombolysis 시행 여부를 결정해 주십시오.
